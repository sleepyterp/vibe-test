<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignSpy — Graphic Design Inspiration Finder</title>
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #7c6af7;
      --accent-hover: #9585fa;
      --accent-dim: #7c6af720;
      --text: #e8e8f0;
      --text-muted: #888899;
      --tag-bg: #2a2a36;
      --tag-hover: #343446;
      --success: #6af79a;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --sidebar-w: 300px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .logo span { color: var(--accent); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle-sidebar-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font);
      transition: all 0.15s;
      display: none;
    }

    .toggle-sidebar-btn:hover { color: var(--text); background: var(--tag-hover); }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      height: calc(100vh - 57px);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease;
    }

    .sidebar.hidden {
      margin-left: calc(-1 * var(--sidebar-w));
    }

    .sidebar-inner {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-section {}

    .section-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* ── TAGS ── */
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 4px 11px;
      font-size: 0.76rem;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
      color: var(--text-muted);
    }

    .tag:hover { background: var(--tag-hover); color: var(--text); }

    .tag.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    /* ── INPUTS ── */
    .input-row {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      color: var(--text);
      font-size: 0.82rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }

    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text-muted); }

    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--tag-hover); color: var(--text); }

    /* ── CHIPS ── */
    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 0.74rem;
      color: var(--accent-hover);
    }

    .chip-x {
      cursor: pointer;
      opacity: 0.6;
      font-size: 0.95rem;
      line-height: 1;
      transition: opacity 0.1s;
    }

    .chip-x:hover { opacity: 1; }

    /* ── SEARCH BUTTON ── */
    .search-btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.01em;
    }

    .search-btn:hover { background: var(--accent-hover); }
    .search-btn:disabled { background: var(--tag-bg); color: var(--text-muted); cursor: not-allowed; }

    /* ── PRESETS ── */
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .preset-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.76rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
      font-family: var(--font);
      text-align: left;
    }

    .preset-item:hover { background: var(--tag-hover); color: var(--text); border-color: #444; }

    /* ── RESULTS PANEL ── */
    .results-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── EMPTY / STATUS STATES ── */
    .state-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      color: var(--text-muted);
      padding: 40px;
    }

    .state-icon { font-size: 3rem; opacity: 0.4; }

    .state-screen h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      opacity: 0.6;
    }

    .state-screen p { font-size: 0.85rem; max-width: 360px; }

    /* ── RESULTS HEADER ── */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .results-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .results-meta strong { color: var(--text); }

    .view-toggle {
      display: flex;
      gap: 4px;
    }

    .view-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-muted);
      font-family: var(--font);
      transition: all 0.12s;
    }

    .view-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-hover); }

    /* ── IMAGE GRID ── */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .image-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .image-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .image-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--surface2);
    }

    .image-card-body {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .image-card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .image-card-source {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ── LIST VIEW ── */
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      text-decoration: none;
      transition: border-color 0.15s;
    }

    .result-item:hover { border-color: var(--accent); }

    .result-thumb {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--surface2);
      flex-shrink: 0;
    }

    .result-thumb-placeholder {
      width: 80px;
      height: 60px;
      background: var(--surface2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .result-body { flex: 1; min-width: 0; }

    .result-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .result-url {
      font-size: 0.72rem;
      color: var(--accent);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-snippet {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-badge {
      display: inline-block;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.65rem;
      color: var(--accent-hover);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 6px;
    }

    /* ── SPINNER ── */
    .spinner-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 720px) {
      .sidebar {
        position: fixed;
        top: 57px;
        left: 0;
        height: calc(100vh - 57px);
        z-index: 150;
        box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      }
      .toggle-sidebar-btn { display: block; }
      .results-panel { padding: 16px; }
      .image-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">◈</div>
    Design<span>Spy</span>
  </div>
  <div class="header-right">
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()" id="toggleBtn">☰ Filters</button>
  </div>
</header>

<div class="app">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">

      <!-- Presets -->
      <div class="sidebar-section">
        <div class="section-title">Quick Presets</div>
        <div class="preset-list" id="presetList"></div>
      </div>

      <hr class="divider" />

      <!-- Industry -->
      <div class="sidebar-section">
        <div class="section-title">Industry</div>
        <div class="tag-group" id="industryTags"></div>
      </div>

      <!-- Creative Type -->
      <div class="sidebar-section">
        <div class="section-title">Creative Piece Type</div>
        <div class="tag-group" id="typeTags"></div>
      </div>

      <!-- File Type -->
      <div class="sidebar-section">
        <div class="section-title">File Type</div>
        <div class="tag-group" id="fileTags"></div>
      </div>

      <hr class="divider" />

      <!-- Companies -->
      <div class="sidebar-section">
        <div class="section-title">Target Companies</div>
        <div class="input-row" style="margin-bottom:8px">
          <input type="text" id="companyInput" placeholder="Add company…" />
          <button class="btn" onclick="addCompany()">+</button>
        </div>
        <div class="section-title" style="margin-bottom:6px">Quick-add AEC firms</div>
        <div class="tag-group" id="companyPresets"></div>
        <div class="chip-list" id="companyChips"></div>
      </div>

      <!-- Keywords -->
      <div class="sidebar-section">
        <div class="section-title">Extra Keywords</div>
        <div class="input-row" style="margin-bottom:6px">
          <input type="text" id="keywordInput" placeholder="e.g. sustainability…" />
          <button class="btn" onclick="addKeyword()">+</button>
        </div>
        <div class="chip-list" id="keywordChips"></div>
      </div>

      <hr class="divider" />

      <button class="search-btn" id="searchBtn" onclick="runSearch()">Search</button>

    </div>
  </aside>

  <!-- ── RESULTS ── -->
  <main class="results-panel" id="resultsPanel">
    <div class="state-screen" id="emptyState">
      <div class="state-icon">◈</div>
      <h2>Set your filters and search</h2>
      <p>Choose an industry, creative type, file format, and companies on the left — then hit Search to find real design examples.</p>
    </div>
  </main>

</div>

<script>
  const API_KEY = '045975c86155595809ac5b971a5a8d5541d4e81e5cc9fe864462bf57aece3b99';

  // ── DATA ──────────────────────────────────────────────────────────────────

  const INDUSTRIES = [
    "Architecture & Engineering", "Construction", "Technology", "Healthcare",
    "Finance & Banking", "Real Estate", "Energy & Utilities",
    "Government & Public Sector", "Education", "Nonprofit",
    "Retail & Consumer", "Transportation & Logistics",
    "Environmental & Sustainability", "Legal & Professional Services",
    "Hospitality & Travel",
  ];

  const CREATIVE_TYPES = [
    { label: "Fact Sheet",            keywords: ["fact sheet", "factsheet"] },
    { label: "Brochure",              keywords: ["brochure", "capabilities brochure"] },
    { label: "Case Study",            keywords: ["case study"] },
    { label: "Annual Report",         keywords: ["annual report"] },
    { label: "White Paper",           keywords: ["white paper"] },
    { label: "Proposal",              keywords: ["proposal"] },
    { label: "Social Media Post",     keywords: ["social media post"] },
    { label: "Newsletter",            keywords: ["newsletter"] },
    { label: "Ad / Banner",           keywords: ["advertisement", "banner ad"] },
    { label: "Infographic",           keywords: ["infographic"] },
    { label: "Presentation",          keywords: ["presentation deck"] },
    { label: "One-Pager",             keywords: ["one pager", "one-pager"] },
    { label: "Capabilities Statement",keywords: ["capabilities statement"] },
    { label: "Data Sheet",            keywords: ["data sheet", "datasheet"] },
    { label: "Event Flyer",           keywords: ["event flyer"] },
  ];

  const FILE_TYPES = [
    { label: "PDF",       value: "pdf" },
    { label: "JPG",       value: "jpg" },
    { label: "PNG",       value: "png" },
    { label: "Any",       value: null },
  ];

  const COMPANY_PRESETS = [
    "AECOM","WSP","Jacobs","Kimley-Horn","GHD","Stantec","Tetra Tech",
    "Burns & McDonnell","HDR","HNTB","Parsons","Arcadis","Gensler","HOK","Perkins&Will",
  ];

  const PRESETS = [
    { label: "⚡ AEC Fact Sheets (PDF)",    industry: "Architecture & Engineering", type: "Fact Sheet",            file: "pdf",  companies: ["AECOM","WSP","Jacobs","Kimley-Horn","GHD"] },
    { label: "⚡ AEC Case Studies",         industry: "Architecture & Engineering", type: "Case Study",            file: "pdf",  companies: ["AECOM","Stantec","Jacobs"] },
    { label: "⚡ AEC Annual Reports",       industry: "Architecture & Engineering", type: "Annual Report",         file: "pdf",  companies: ["AECOM","WSP","Arcadis"] },
    { label: "⚡ Tech Brochures",           industry: "Technology",                 type: "Brochure",              file: "pdf",  companies: [] },
    { label: "⚡ Healthcare Infographics",  industry: "Healthcare",                 type: "Infographic",           file: null,   companies: [] },
  ];

  const INDUSTRY_KEYWORDS = {
    "Architecture & Engineering": '"architecture" OR "engineering" OR "AEC"',
    "Construction":               '"construction"',
    "Technology":                 '"technology" OR "software"',
    "Healthcare":                 '"healthcare" OR "health"',
    "Finance & Banking":          '"finance" OR "banking"',
    "Real Estate":                '"real estate"',
    "Energy & Utilities":         '"energy" OR "utilities"',
    "Government & Public Sector": '"government" OR "public sector"',
    "Education":                  '"education"',
    "Nonprofit":                  '"nonprofit" OR "non-profit"',
    "Retail & Consumer":          '"retail" OR "consumer"',
    "Transportation & Logistics": '"transportation" OR "logistics"',
    "Environmental & Sustainability": '"environmental" OR "sustainability"',
    "Legal & Professional Services":  '"legal" OR "professional services"',
    "Hospitality & Travel":       '"hospitality" OR "travel"',
  };

  // ── STATE ─────────────────────────────────────────────────────────────────

  const state = {
    industry: null,
    type: null,
    file: null,
    companies: [],
    keywords: [],
    viewMode: 'grid',   // 'grid' | 'list'
    loading: false,
  };

  // ── QUERY BUILDER ─────────────────────────────────────────────────────────

  function buildQuery() {
    const parts = [];

    if (state.type) {
      const t = CREATIVE_TYPES.find(x => x.label === state.type);
      if (t) {
        parts.push(t.keywords.length === 1
          ? `"${t.keywords[0]}"`
          : `(${t.keywords.map(k => `"${k}"`).join(' OR ')})`);
      }
    }

    if (state.industry && INDUSTRY_KEYWORDS[state.industry]) {
      parts.push(INDUSTRY_KEYWORDS[state.industry]);
    }

    if (state.companies.length > 0) {
      parts.push(state.companies.length === 1
        ? `"${state.companies[0]}"`
        : `(${state.companies.map(c => `"${c}"`).join(' OR ')})`);
    }

    state.keywords.forEach(k => parts.push(`"${k}"`));

    if (state.file) parts.push(`filetype:${state.file}`);

    return parts.join(' ');
  }

  // ── SEARCH ────────────────────────────────────────────────────────────────

  async function runSearch() {
    const q = buildQuery();
    if (!q) {
      alert('Select at least one filter or company first.');
      return;
    }

    state.loading = true;
    renderResults(null, q);

    // For image file types (jpg/png) or no filetype — use image search
    // For pdf — use web search
    const isImageSearch = state.file !== 'pdf';
    const endpoint = 'https://serpapi.com/search.json';

    const params = new URLSearchParams({
      api_key: API_KEY,
      q,
      engine: 'google',
      num: '20',
    });

    if (isImageSearch && state.file !== null) {
      params.set('tbm', 'isch');
    } else if (state.file === 'pdf') {
      // web search, no tbm
    } else {
      // no filetype set — use image search for visual inspiration
      params.set('tbm', 'isch');
    }

    try {
      const res = await fetch(`${endpoint}?${params}`);
      let data;
      try { data = await res.json(); } catch { data = {}; }
      if (!res.ok) {
        const msg = data.error || `HTTP ${res.status}`;
        throw new Error(msg);
      }
      state.loading = false;
      renderResults(data, q);
    } catch (err) {
      state.loading = false;
      const isCors = err.message === 'Failed to fetch';
      renderError(
        isCors
          ? 'CORS error: SerpAPI blocked the browser request. See instructions below to fix.'
          : err.message,
        isCors
      );
    }
  }

  // ── RENDER RESULTS ────────────────────────────────────────────────────────

  function renderResults(data, query) {
    const panel = document.getElementById('resultsPanel');

    if (state.loading) {
      panel.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div></div>`;
      return;
    }

    if (!data) return;

    // Gather results from either image or organic
    const imageResults = data.images_results || [];
    const organicResults = data.organic_results || [];
    const total = imageResults.length + organicResults.length;

    if (total === 0) {
      panel.innerHTML = `
        <div class="state-screen">
          <div class="state-icon">🔍</div>
          <h2>No results found</h2>
          <p>Try broadening your filters — fewer companies, a different file type, or fewer keywords.</p>
        </div>`;
      return;
    }

    const isImages = imageResults.length > 0;
    const count = isImages ? imageResults.length : organicResults.length;

    panel.innerHTML = `
      <div class="results-header">
        <div class="results-meta">
          <strong>${count}</strong> results for <strong>${escHtml(query)}</strong>
        </div>
        <div class="view-toggle">
          <button class="view-btn ${state.viewMode === 'grid' ? 'active' : ''}" onclick="setView('grid')">▦ Grid</button>
          <button class="view-btn ${state.viewMode === 'list' ? 'active' : ''}" onclick="setView('list')">☰ List</button>
        </div>
      </div>
      <div id="resultsBody"></div>`;

    renderResultsBody(isImages ? imageResults : organicResults, isImages);
  }

  function renderResultsBody(items, isImages) {
    const body = document.getElementById('resultsBody');
    if (!body) return;

    if (state.viewMode === 'grid' && isImages) {
      body.innerHTML = `<div class="image-grid">${items.map(img => `
        <a class="image-card" href="${escHtml(img.original || img.link || '#')}" target="_blank" rel="noopener noreferrer">
          <img src="${escHtml(img.thumbnail)}" alt="${escHtml(img.title || '')}" loading="lazy"
               onerror="this.style.display='none'" />
          <div class="image-card-body">
            <div class="image-card-title">${escHtml(img.title || 'Untitled')}</div>
            <div class="image-card-source">${escHtml(hostOf(img.link || img.source || ''))}</div>
          </div>
        </a>`).join('')}</div>`;
    } else {
      // List view — works for both image results and organic results
      body.innerHTML = `<div class="result-list">${items.map(item => {
        const thumb = item.thumbnail || item.image;
        const url = item.original || item.link || '#';
        const title = item.title || 'Untitled';
        const snippet = item.snippet || item.source || '';
        const displayUrl = item.displayed_link || item.link || item.source || '';
        const ext = state.file ? state.file.toUpperCase() : '';

        return `<a class="result-item" href="${escHtml(url)}" target="_blank" rel="noopener noreferrer">
          ${thumb
            ? `<img class="result-thumb" src="${escHtml(thumb)}" alt="" loading="lazy" onerror="this.parentNode.replaceChild(makePlaceholder('${ext || '🔗'}'), this)" />`
            : `<div class="result-thumb-placeholder">${ext || '🔗'}</div>`}
          <div class="result-body">
            <div class="result-title">${escHtml(title)}</div>
            <div class="result-url">${escHtml(displayUrl)}</div>
            ${snippet ? `<div class="result-snippet">${escHtml(snippet)}</div>` : ''}
            ${ext ? `<span class="result-badge">${ext}</span>` : ''}
          </div>
        </a>`;
      }).join('')}</div>`;
    }
  }

  function makePlaceholder(label) {
    const d = document.createElement('div');
    d.className = 'result-thumb-placeholder';
    d.textContent = label;
    return d;
  }

  function renderError(msg, isCors = false) {
    document.getElementById('resultsPanel').innerHTML = `
      <div class="state-screen">
        <div class="state-icon">⚠️</div>
        <h2>Search failed</h2>
        <p style="color:#f76a6a;font-family:monospace;font-size:0.8rem;margin-bottom:8px">${escHtml(msg)}</p>
        ${isCors ? `<p style="max-width:480px;text-align:left;line-height:1.7">
          SerpAPI doesn't allow direct browser requests (CORS policy).<br>
          <strong>Fix:</strong> Go to <a href="https://serpapi.com/dashboard" target="_blank" style="color:var(--accent)">serpapi.com/dashboard</a>
          → <em>API Settings</em> → add <code style="background:var(--surface2);padding:2px 6px;border-radius:4px">sleepyterp.github.io</code>
          to your <strong>Allowed Domains</strong> list, then try again.
        </p>` : ''}
      </div>`;
  }

  function setView(mode) {
    state.viewMode = mode;
    // Re-render body without re-fetching
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view-btn').forEach(b => {
      if (b.textContent.toLowerCase().includes(mode)) b.classList.add('active');
    });
    // Grab last results from DOM items and rerender
    const items = [];
    document.querySelectorAll('.image-card, .result-item').forEach(el => {
      const thumb = el.querySelector('img');
      const title = el.querySelector('.image-card-title, .result-title');
      const url = el.querySelector('.result-url');
      const snippet = el.querySelector('.result-snippet');
      items.push({
        original: el.href,
        link: el.href,
        thumbnail: thumb ? thumb.src : null,
        title: title ? title.textContent : '',
        displayed_link: url ? url.textContent : '',
        snippet: snippet ? snippet.textContent : '',
      });
    });
    renderResultsBody(items, state.file !== 'pdf');
  }

  // ── SIDEBAR TOGGLE ────────────────────────────────────────────────────────

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('hidden');
  }

  // ── TAG RENDERING ─────────────────────────────────────────────────────────

  function renderTags(id, items, stateKey, labelFn, valueFn) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    items.forEach(item => {
      const val = valueFn(item);
      const tag = document.createElement('div');
      tag.className = 'tag' + (state[stateKey] === val ? ' active' : '');
      tag.textContent = labelFn(item);
      tag.onclick = () => { state[stateKey] = state[stateKey] === val ? null : val; renderSidebar(); };
      el.appendChild(tag);
    });
  }

  function renderCompanyPresets() {
    const el = document.getElementById('companyPresets');
    el.innerHTML = '';
    COMPANY_PRESETS.forEach(name => {
      const tag = document.createElement('div');
      tag.className = 'tag' + (state.companies.includes(name) ? ' active' : '');
      tag.textContent = name;
      tag.onclick = () => {
        state.companies = state.companies.includes(name)
          ? state.companies.filter(c => c !== name)
          : [...state.companies, name];
        renderSidebar();
      };
      el.appendChild(tag);
    });
  }

  function renderChips(id, arr, removeFn) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    arr.forEach(val => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `${escHtml(val)} <span class="chip-x" onclick="${removeFn}('${val.replace(/'/g,"\\'") }')">×</span>`;
      el.appendChild(chip);
    });
  }

  function renderPresets() {
    const el = document.getElementById('presetList');
    el.innerHTML = '';
    PRESETS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'preset-item';
      btn.textContent = p.label;
      btn.onclick = () => {
        state.industry = p.industry;
        state.type = p.type;
        state.file = p.file;
        state.companies = [...p.companies];
        renderSidebar();
      };
      el.appendChild(btn);
    });
  }

  function renderSidebar() {
    renderTags('industryTags', INDUSTRIES,    'industry', i => i,       i => i);
    renderTags('typeTags',     CREATIVE_TYPES,'type',     t => t.label, t => t.label);
    renderTags('fileTags',     FILE_TYPES,    'file',     f => f.label, f => f.value);
    renderCompanyPresets();
    renderChips('companyChips', state.companies, 'removeCompany');
    renderChips('keywordChips', state.keywords,  'removeKeyword');
    renderPresets();
  }

  // ── COMPANY / KEYWORD MANAGEMENT ──────────────────────────────────────────

  function addCompany() {
    const inp = document.getElementById('companyInput');
    const val = inp.value.trim();
    if (val && !state.companies.includes(val)) { state.companies.push(val); renderSidebar(); }
    inp.value = ''; inp.focus();
  }

  function removeCompany(name) {
    state.companies = state.companies.filter(c => c !== name);
    renderSidebar();
  }

  function addKeyword() {
    const inp = document.getElementById('keywordInput');
    const val = inp.value.trim();
    if (val && !state.keywords.includes(val)) { state.keywords.push(val); renderSidebar(); }
    inp.value = ''; inp.focus();
  }

  function removeKeyword(kw) {
    state.keywords = state.keywords.filter(k => k !== kw);
    renderSidebar();
  }

  document.getElementById('companyInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCompany(); });
  document.getElementById('keywordInput').addEventListener('keydown', e => { if (e.key === 'Enter') addKeyword(); });

  // ── UTILS ─────────────────────────────────────────────────────────────────

  function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
  }

  // ── INIT ──────────────────────────────────────────────────────────────────
  renderSidebar();
</script>
</body>
</html>
